server:
  port: 8080

spring:
  application:
    name: mael-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mael}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
  jpa:
    # Schema tạo bằng script database/01_schema.sql, Hibernate chỉ kiểm tra khớp entity
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Base64, tối thiểu 256 bit. ĐỔI khi deploy (đặt biến môi trường JWT_SECRET)
    secret: ${JWT_SECRET:bWFlbC1tdWx0aS1hZ2VudC1lZHRlY2gtbGVhcm5pbmctc2VjcmV0LWtleS0yMDI2LWV4ZTEwMQ==}
    expiration-ms: 86400000   # 24 giờ
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  ai:
    # mock = câu trả lời mẫu. Khi tích hợp OpenAI đổi thành openai và thêm OpenAiOrchestrator
    provider: mock
  payment:
    # mock = chưa gọi MoMo. Khi tích hợp đổi thành momo và thêm MomoPaymentGateway
    provider: mock
    # Cho phép nút "Giả lập thanh toán thành công" ở FE. TẮT khi lên production
    mock-confirm-enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.mael: INFO

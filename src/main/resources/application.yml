# Mọi key / mật khẩu đọc từ file .env ở thư mục gốc project (copy từ .env.example).
# Biến môi trường của hệ điều hành vẫn được ưu tiên hơn giá trị trong .env.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: mael-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mael}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    # Tự chạy các file src/main/resources/db/migration/V*.sql theo thứ tự, mỗi file đúng 1 lần
    enabled: true
    locations: classpath:db/migration
  jpa:
    # Bảng do Flyway tạo, Hibernate chỉ kiểm tra khớp entity
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  # Render tự đặt biến PORT; chạy máy cá nhân thì dùng 8089
  port: ${SERVER_PORT:${PORT:8089}}

app:
  flyway:
    # DB cũ tạo bằng tay (có bảng nhưng chưa có flyway_schema_history): xoá sạch rồi để Flyway tạo lại, chỉ xảy ra 1 lần.
    # Đặt false nếu muốn giữ DB cũ (khi đó tự xoá DB rồi chạy lại)
    reset-legacy: ${FLYWAY_RESET_LEGACY:true}
  jwt:
    # Base64, tối thiểu 256 bit
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  site:
    # Thông tin liên hệ hiện ở trang chủ
    email: ${SITE_EMAIL:maeledu709@gmail.com}
  security:
    # Bật captcha cho form đăng ký và form tư vấn trung tâm / trường học
    captcha-enabled: ${CAPTCHA_ENABLED:true}
    # Mỗi số điện thoại / IP gửi tối đa bao nhiêu yêu cầu tư vấn trong 24 giờ
    lead-max-per-phone-per-day: ${LEAD_MAX_PER_PHONE:2}
    lead-max-per-ip-per-day: ${LEAD_MAX_PER_IP:5}
    # Số lần đăng nhập sai tối đa trong 15 phút cho 1 IP + email
    login-max-fail: ${LOGIN_MAX_FAIL:8}
  ai:
    # gemini = gọi Gemini API bằng 4 key bên dưới. mock = chỉ dùng kịch bản soạn sẵn (không gọi AI)
    # gemini,motapis = thêm DeepSeek (MotAPI) cho tác vụ thuần chữ, ảnh / PDF vẫn dùng Gemini
    provider: ${AI_PROVIDER:mock}
  motapis:
    base-url: ${MOTAPIS_BASE_URL:https://motapis.com/v1}
    api-key: ${MOTAPIS_API_KEY:}
    model: ${MOTAPIS_MODEL:deepseek-v4-flash}
    # Tác vụ giao cho DeepSeek (chỉ discussion, analysis; photo / document luôn là Gemini vì cần đọc ảnh, PDF)
    tasks: ${MOTAPIS_TASKS:discussion,analysis}
    timeout-seconds: ${MOTAPIS_TIMEOUT_SECONDS:60}
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    # Model rẻ, nhanh. Model chính không có (404) thì tự dùng model dự phòng
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-2.5-flash-lite}
    # Giải toán từ ảnh cần đọc chính xác phân số, chữ nhỏ: dùng bản Flash (không lite). Không có thì tự lùi về model chung
    photo-model: ${GEMINI_PHOTO_MODEL:gemini-3-flash-preview}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:60}
    # Mỗi tác vụ 1 key riêng. Key nào hết lượt (429) thì tự thử key còn lại
    keys:
      discussion: ${GEMINI_KEY_DISCUSSION:}
      analysis: ${GEMINI_KEY_ANALYSIS:}
      document: ${GEMINI_KEY_DOCUMENT:}
      photo: ${GEMINI_KEY_PHOTO:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model-chat: ${OPENAI_MODEL_CHAT:gpt-6-luna}
    model-reasoning: ${OPENAI_MODEL_REASONING:gpt-6.1-sol}
  google-speech:
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
  google-tts:
    # API key Google Cloud (bật Cloud Text-to-Speech API). Để trống = FE dùng giọng đọc của trình duyệt
    api-key: ${GOOGLE_TTS_API_KEY:}
  payment:
    # mock = chưa gọi MoMo. Khi tích hợp đổi thành momo và thêm MomoPaymentGateway
    provider: ${PAYMENT_PROVIDER:mock}
    # Cho phép nút "Giả lập thanh toán thành công" ở FE. TẮT khi lên production
    mock-confirm-enabled: ${PAYMENT_MOCK_CONFIRM_ENABLED:false}
  momo:
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    redirect-url: ${MOMO_REDIRECT_URL:http://localhost:5173/checkout/result}
    ipn-url: ${MOMO_IPN_URL:}
  r2:
    # Cloudflare R2 lưu ảnh học sinh chụp giải bài. Để trống = lưu ổ đĩa server (thư mục uploads)
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:}
    # https://pub-xxxx.r2.dev hoặc domain riêng gắn vào bucket
    public-url: ${R2_PUBLIC_URL:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.mael: INFO
